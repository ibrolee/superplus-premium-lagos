name: One-time Stage 3 reception navigation cleanup
on:
  push:
    branches: [fix/stage3-retired-reception-links]
permissions:
  contents: write
jobs:
  update-navigation:
    if: github.repository == 'ibrolee/superplus-premium-lagos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
      - name: Update only retired navigation links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(file, changes):
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              for old, new, n in changes:
                  if s.count(old) != n:
                      raise RuntimeError(f'{file}: expected {n} matches, found {s.count(old)} for {old!r}')
                  s = s.replace(old, new)
              if '/reception-dashboard' in s:
                  raise RuntimeError(f'{file}: stale URL remains')
              p.write_text(s, encoding='utf-8')
              print(f'Updated {file}')

          site = Path('src/components/site.tsx')
          text = site.read_text(encoding='utf-8')
          start = '            <Link\n              to="/reception-dashboard"'
          stop = '            <Button\n              asChild'
          if text.count(start) != 1:
              raise RuntimeError('Expected exactly one old mobile reception link')
          a = text.index(start)
          b = text.index(stop, a)
          if text[a:b].count('to="/staff"') != 1:
              raise RuntimeError('Mobile staff link mismatch')
          text = text[:a] + text[b:]
          footer = '\n'.join([
              '              {',
              '                label: "Reception Dashboard",',
              '                to: "/reception-dashboard",',
              '              },',
              '              { label: "Staff Portal", to: "/staff" },',
          ])
          if text.count(footer) != 1:
              raise RuntimeError('Footer legacy links changed unexpectedly')
          text = text.replace(footer, '              { label: "Portal", to: "/portal" },')
          utility = '\n'.join([
              '        <Link to="/reception-dashboard">',
              '          Reception Dashboard',
              '        </Link>',
              '        <Link to="/staff">Staff Portal</Link>',
          ])
          if text.count(utility) != 1:
              raise RuntimeError('Utility-bar legacy links changed unexpectedly')
          text = text.replace(utility, '        <Link to="/portal">Portal</Link>')
          if text.count('title="Member & Staff"') != 1:
              raise RuntimeError('Footer title changed unexpectedly')
          text = text.replace('title="Member & Staff"', 'title="Member & Portal"')
          if '/reception-dashboard' in text:
              raise RuntimeError('Additional legacy URL remains in site component')
          site.write_text(text, encoding='utf-8')
          print('Updated src/components/site.tsx')

          edit('src/routes/management-members.tsx', [
              ('href="/reception-dashboard">Open full member tools', 'href="/reception-workspace">Open Reception 2.0', 1),
              ('href="/reception-dashboard"', 'href="/management-standard-plan"', 2),
              ('Registration and payment changes remain in the existing dashboard.', 'Registration and payment changes use dedicated protected forms.', 1),
              ('Read-only directory · edits and payments use the existing member tools.', 'Read-only directory · registrations and payments use dedicated protected tools.', 1),
          ])
          edit('src/routes/management-preview.tsx', [
              ('href="/reception-dashboard" className="mt-8', 'href="/management-members" className="mt-8', 1),
              ('href="/reception-dashboard" className="inline-flex', 'href="/reception-workspace" className="inline-flex', 1),
              ('{ label: "Reception dashboard", desc: "Register & renew members", href: "/reception-dashboard", icon: UserPlus }', '{ label: "Register & renew", desc: "Register & renew members", href: "/management-standard-plan", icon: UserPlus }', 1),
              ('Registration, scanning and payroll remain in your existing tools.', 'Registration, scanning and payroll are available through dedicated protected tools.', 1),
          ])
          edit('src/routes/reception-checkin.tsx', [
              ('to="/reception-dashboard"', 'to="/reception-workspace"', 1),
              ('\n                  Dashboard\n', '\n                  Reception 2.0\n', 1),
          ])
          edit('src/routes/reception-member.$memberId.tsx', [
              ('window.location.href = "/reception-dashboard";', 'window.location.href = "/portal/reception";', 1),
              ('<Link to="/reception-dashboard">', '<Link to="/reception-workspace">', 2),
              ('Back to Dashboard', 'Back to Reception 2.0', 2),
          ])
          edit('src/routes/management-communications.tsx', [
              ('href="/reception-dashboard"', 'href="/reception-workspace"', 1),
              ('/> Reception Dashboard</a>', '/> Reception 2.0</a>', 1),
          ])
          edit('src/routes/management-standard-plan.tsx', [
              ('href="/reception-dashboard"', 'href="/reception-workspace"', 1),
              ('Original Reception Dashboard →', 'Reception 2.0 →', 1),
              ('Use the existing Reception Dashboard.', 'Ask management to check the plan setup.', 1),
              ('Match their names and prices to the existing reception dashboard.', 'Match their names and prices to the approved reception configuration.', 1),
          ])
          excluded = {'src/routes/reception-dashboard.tsx', 'src/routeTree.gen.ts', 'src/components/reception/ReceptionRouteGate.tsx'}
          remaining = [str(path) for path in Path('src').rglob('*.tsx') if str(path) not in excluded and '/reception-dashboard' in path.read_text(encoding='utf-8')]
          if remaining:
              raise RuntimeError(f'Unexpected stale links remain in: {remaining}')
          print('Verified: only legacy redirect and access gate retain retired URL')
          PY
      - name: Commit seven files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/components/site.tsx src/routes/management-members.tsx src/routes/management-preview.tsx src/routes/reception-checkin.tsx 'src/routes/reception-member.$memberId.tsx' src/routes/management-communications.tsx src/routes/management-standard-plan.tsx
          git rm -- .github/workflows/temporary-stage3-navigation-cleanup.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Clean retired reception links and preserve legacy redirect'
          git push origin HEAD:refs/heads/fix/stage3-retired-reception-links
