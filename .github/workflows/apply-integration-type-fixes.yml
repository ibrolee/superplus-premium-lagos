name: Apply checked integration TypeScript fixes

on:
  push:
    branches:
      - integration/september-attendance-missed-scans
    paths:
      - .github/workflows/apply-integration-type-fixes.yml
      - scripts/integration-type-fixes.py

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.ref == 'refs/heads/integration/september-attendance-missed-scans'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply small, asserted source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integration-type-fixes.py')
          content = p.read_text()
          old = "exact(\"src/routes/reception-dashboard.tsx\", 'selectedAddMembershipPlan.name', 'selectedAddMembershipPlan!.name')"
          assert content.count(old) == 1
          p.write_text(content.replace(old, "exact(\"src/routes/reception-dashboard.tsx\", 'selectedAddMembershipPlan.name', 'selectedAddMembershipPlan!.name', 6)"))
          PY
          python3 scripts/integration-type-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/reception-dashboard.tsx')
          s = p.read_text()
          for result in ('attendanceResult', 'monthlyAttendanceResult'):
              old = f'({result}.data || []) as Attendance[]'
              new = f'({result}.data || []).map((record) => ({{ ...record, member: Array.isArray(record.member) ? record.member[0] ?? null : record.member }})) as Attendance[]'
              assert s.count(old) == 1, (result, s.count(old))
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Full client, SSR and server build without deployment
        run: bun run build
      - name: Strict TypeScript compilation check
        run: bunx tsc --noEmit
      - name: Commit only the verified source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/site.tsx src/lib/supabase.ts src/routes/blog.tsx src/routes/join.tsx src/routes/management-communications.tsx src/routes/management-preview.tsx src/routes/management-revenue.tsx src/routes/management-staff-monthly.tsx src/routes/management-staff-review.tsx src/routes/management-staff.tsx src/routes/management-standard-plan.tsx src/routes/member.tsx src/routes/payment.callback.tsx src/routes/reception-dashboard.tsx src/routes/staff-admin.tsx src/routes/staff-attendance.tsx
          git diff --cached --check
          git commit -m 'Resolve strict TypeScript errors while preserving membership and attendance behavior'
          git push origin HEAD:integration/september-attendance-missed-scans
