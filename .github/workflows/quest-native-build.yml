name: Quest Native Android Build

on:
  push:
    branches:
      - quest-native-build
    paths:
      - 'quest-native-src.b64'
      - 'quest-overrides/**'
      - '.github/workflows/quest-native-build.yml'
  workflow_dispatch:

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Quest source and apply UI overrides
        run: |
          mkdir -p quest-native
          base64 -d quest-native-src.b64 | tar -xzf - -C quest-native
          if [ -d quest-overrides ]; then
            cp -a quest-overrides/. quest-native/
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: quest-native
        run: |
          npm install --no-audit --no-fund
          npx expo install @react-native-community/datetimepicker

      - name: Typecheck
        working-directory: quest-native
        run: npm run typecheck

      - name: Initialize EAS project
        working-directory: quest-native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest project:init --account ibrolee98 --non-interactive

      - name: Build standalone Android preview APK on EAS
        working-directory: quest-native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('eas-build.json','utf8'));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.artifactUrl;
          if (!url) {
            console.error('No Android artifact URL found in EAS JSON');
            process.exit(1);
          }
          fs.writeFileSync('apk-url.txt', url);
          console.log('EAS build id:', build?.id || 'unknown');
          NODE
          curl -L --fail --retry 3 "$(cat apk-url.txt)" -o Quest-Android.apk
          test -s Quest-Android.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest-Android-APK
          path: quest-native/Quest-Android.apk
          if-no-files-found: error
          retention-days: 14
