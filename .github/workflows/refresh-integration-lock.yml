name: Repair integration Bun lockfile once

on:
  push:
    branches:
      - integration/september-attendance-missed-scans
    paths:
      - .github/workflows/refresh-integration-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/integration/september-attendance-missed-scans'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Resolve lockfile using existing package manifest
        run: bun install
      - name: Commit only generated lockfile, never main
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bun.lock
          git commit -m 'Sync Bun lockfile with declared dependencies'
          git push origin HEAD:integration/september-attendance-missed-scans
