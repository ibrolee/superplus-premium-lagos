name: Expo Go iPhone preview

on:
  push:
    branches:
      - build/ios-preview-20261003
    paths:
      - ".github/workflows/expo-go-preview.yml"
  workflow_dispatch:

concurrency:
  group: expo-go-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout current app
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --package-lock=false

      - name: Install tunnel helper
        run: npm install --no-save --legacy-peer-deps @expo/ngrok

      - name: Start Expo Go tunnel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          nohup npx expo start --go --tunnel --clear > /tmp/expo-go-preview.log 2>&1 &
          echo $! > /tmp/expo-go-preview.pid

          for i in $(seq 1 90); do
            TUNNEL_URL=$(curl -fsS http://127.0.0.1:4040/api/tunnels 2>/dev/null | node -e '
              let input = "";
              process.stdin.on("data", d => input += d);
              process.stdin.on("end", () => {
                try {
                  const data = JSON.parse(input);
                  const tunnel = (data.tunnels || []).find(t => String(t.public_url || "").startsWith("https://"));
                  if (tunnel) process.stdout.write(tunnel.public_url);
                } catch {}
              });
            ' || true)

            if [ -n "$TUNNEL_URL" ]; then
              EXPO_URL="exps://${TUNNEL_URL#https://}"
              printf '%s\n' "$EXPO_URL" > expo-go-preview-url.txt
              printf '%s\n' "$TUNNEL_URL" > expo-go-tunnel-url.txt
              break
            fi
            sleep 2
          done

          echo "----- Expo preview log -----"
          cat /tmp/expo-go-preview.log
          echo "----- Preview URL -----"
          cat expo-go-preview-url.txt
          test -s expo-go-preview-url.txt

      - name: Upload preview URL
        uses: actions/upload-artifact@v4
        with:
          name: expo-go-preview-url
          path: |
            mobile/expo-go-preview-url.txt
            mobile/expo-go-tunnel-url.txt
          retention-days: 1

      - name: Keep preview tunnel available
        run: |
          echo "Preview tunnel is live for about 45 minutes."
          sleep 2700
