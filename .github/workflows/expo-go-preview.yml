name: Expo Go live preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expo-go-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serve-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TUNNEL_SUBDOMAIN: spf-ios-ibrolee-20261006
    steps:
      - name: Checkout current SPF app
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install app dependencies
        run: npm install --package-lock=false

      - name: Install Expo tunnel helper
        run: npm install --no-save --legacy-peer-deps @expo/ngrok@^4.1.0

      - name: Start Expo Go tunnel and capture deep link
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TRACKING_ID=""
          nohup env CI=1 EXPO_NO_DEV_TOOLS=1 EXPO_TUNNEL_SUBDOMAIN="$EXPO_TUNNEL_SUBDOMAIN" npx expo start --go --tunnel --clear > /tmp/spf-expo.log 2>&1 &
          echo $! > /tmp/spf-expo.pid

          OPEN_URL="https://$EXPO_TUNNEL_SUBDOMAIN.exp.direct/_expo/open?platform=ios&runtime=expo"
          RESPONSE=""
          for i in $(seq 1 90); do
            RESPONSE=$(curl -fsSL --max-time 5 "$OPEN_URL" 2>/dev/null || true)
            if [ -n "$RESPONSE" ]; then
              break
            fi
            if ! kill -0 "$(cat /tmp/spf-expo.pid)" 2>/dev/null; then
              cat /tmp/spf-expo.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$RESPONSE" ]; then
            cat /tmp/spf-expo.log
            exit 1
          fi

          printf '%s\n' "$RESPONSE" > /tmp/spf-expo-open.json
          printf '%s\n' "$OPEN_URL" > /tmp/spf-expo-endpoint.txt
          echo "Expo open endpoint: $OPEN_URL"
          echo "$RESPONSE"

      - name: Publish Expo Go URL data
        uses: actions/upload-artifact@v4
        with:
          name: spf-expo-go-url
          path: |
            /tmp/spf-expo-open.json
            /tmp/spf-expo-endpoint.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep preview tunnel available
        shell: bash
        run: |
          PID=$(cat /tmp/spf-expo.pid)
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30
          done
