name: Expo Go live preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expo-go-preview.yml"

permissions:
  contents: write

jobs:
  serve-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current SPF app
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install app dependencies
        run: npm install --package-lock=false

      - name: Install Expo tunnel helper
        run: npm install --no-save --legacy-peer-deps @expo/ngrok@^4.1.0

      - name: Start public Expo Go tunnel and publish link
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting SPF Expo Go tunnel..."
          npx expo whoami || true
          env CI=1 EXPO_NO_DEV_TOOLS=1 npx expo start --go --tunnel --clear > /tmp/spf-expo.log 2>&1 &
          PID=$!

          PUBLIC_URL=""
          for i in $(seq 1 120); do
            RESPONSE=$(curl -fsSL --max-time 3 "http://127.0.0.1:8081/_expo/open?platform=ios&runtime=expo" 2>/dev/null || true)
            CANDIDATE=$(printf '%s' "$RESPONSE" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p')
            if [[ "$CANDIDATE" == exp://* ]] && [[ "$CANDIDATE" != exp://10.* ]] && [[ "$CANDIDATE" != exp://127.* ]] && [[ "$CANDIDATE" != exp://192.168.* ]] && [[ "$CANDIDATE" != exp://172.* ]]; then
              PUBLIC_URL="$CANDIDATE"
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/spf-expo.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "No public Expo URL appeared."
            cat /tmp/spf-expo.log
            exit 1
          fi

          echo "PUBLIC EXPO GO URL: $PUBLIC_URL"

          OWNER_REPO="${GITHUB_REPOSITORY}"
          API_PATH="repos/$OWNER_REPO/contents/.expo-preview-url.txt"
          OLD_SHA=$(gh api "$API_PATH" --jq .sha 2>/dev/null || true)
          BODY=$(printf '%s\n' "$PUBLIC_URL" | base64 -w0)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message="Update live Expo Go preview link" -f content="$BODY" -f sha="$OLD_SHA" -f branch="main" >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message="Publish live Expo Go preview link" -f content="$BODY" -f branch="main" >/dev/null
          fi

          echo "Link published to .expo-preview-url.txt"
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30
          done
