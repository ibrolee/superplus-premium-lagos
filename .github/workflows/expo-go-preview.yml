name: Expo Go live preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expo-go-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  serve-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current SPF app
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install app dependencies
        run: npm install --package-lock=false

      - name: Install Expo tunnel helper
        run: npm install --no-save --legacy-peer-deps @expo/ngrok@^4.1.0

      - name: Verify Expo account
        run: npx expo whoami

      - name: Start and keep Safari Expo Go preview live
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TRACKING_ID=""

          nohup env CI=1 EXPO_NO_DEV_TOOLS=1 npx expo start --go --tunnel --no-dev --minify --clear > /tmp/spf-expo.log 2>&1 &
          EXPO_PID=$!

          PUBLIC_URL=""
          EXPO_URL=""

          for i in $(seq 1 90); do
            PUBLIC_URL=$(curl -fsSL --max-time 2 http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[]? | select(.proto == "https") | .public_url' | head -n 1 || true)

            if [ -n "$PUBLIC_URL" ] && [ "$PUBLIC_URL" != "null" ]; then
              RESPONSE=$(curl -fsSL --max-time 5 "$PUBLIC_URL/_expo/open?platform=ios&runtime=expo" 2>/dev/null || true)
              EXPO_URL=$(printf '%s' "$RESPONSE" | jq -r '.url // empty' 2>/dev/null || true)

              if [ -z "$EXPO_URL" ]; then
                EXPO_URL=$(printf '%s' "$PUBLIC_URL" | sed -E 's#^https?://#exp://#; s#/$##')
              fi

              if [ -n "$EXPO_URL" ]; then
                break
              fi
            fi

            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              cat /tmp/spf-expo.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$EXPO_URL" ]; then
            cat /tmp/spf-expo.log
            exit 1
          fi

          echo "Safari Expo Go preview: $EXPO_URL"

          gh api --method POST             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state=success             -f context=expo-go-preview             -f description="$EXPO_URL" >/dev/null

          while kill -0 "$EXPO_PID" 2>/dev/null; do
            sleep 30
          done
