name: Expo Go live preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expo-go-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  serve-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current SPF app
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install app dependencies
        run: npm install --package-lock=false

      - name: Verify Expo account
        run: npx expo whoami

      - name: Start secure Safari Expo Go preview
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TRACKING_ID=""

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          env CI=1 EXPO_NO_DEV_TOOLS=1 npx expo start --go --localhost --clear > /tmp/spf-expo.log 2>&1 &
          EXPO_PID=$!

          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8081/_expo/open?platform=ios\&runtime=expo >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              cat /tmp/spf-expo.log
              exit 1
            fi
            sleep 2
          done

          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8081 > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          PUBLIC_HTTPS=""
          for i in $(seq 1 90); do
            PUBLIC_HTTPS=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$PUBLIC_HTTPS" ]; then
              break
            fi
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              cat /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$PUBLIC_HTTPS" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          HOST=${PUBLIC_HTTPS#https://}
          EXPO_URL="exps://$HOST"

          echo "Safari Expo Go preview: $EXPO_URL"

          gh api --method POST             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -f state=success             -f context=expo-go-preview             -f description="$EXPO_URL" >/dev/null

          while kill -0 "$EXPO_PID" 2>/dev/null && kill -0 "$CF_PID" 2>/dev/null; do
            sleep 30
          done
