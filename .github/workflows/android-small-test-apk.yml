name: Standalone Android APK — October 8 update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-small-test-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        run: npm install --package-lock=false

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Validate branded assets
        run: npm run check:assets

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Set Android update build number
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
          config.expo.android.versionCode = 6;
          fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Generate Android project
        run: npx expo prebuild --no-install --platform android

      - name: Build smaller release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk SP-Fitness-1.0.0-2026-10-08.apk

      - name: Preserve compiled standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: sp-fitness-standalone-2026-10-08
          path: mobile/SP-Fitness-1.0.0-2026-10-08.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK can update the current website download
        shell: bash
        run: |
          set -euo pipefail
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK="SP-Fitness-1.0.0-2026-10-08.apk"
          curl -fL --retry 3 "https://github.com/ibrolee/superplus-premium-lagos/releases/download/spf-full-app-1.0.0-2026-10-07/Super-Plus-Fitness-1.0.0.apk" -o /tmp/previous-spf.apk
          "$SDK_TOOLS/apksigner" verify --print-certs "$APK" > /tmp/new-certificate.txt
          "$SDK_TOOLS/apksigner" verify --print-certs /tmp/previous-spf.apk > /tmp/previous-certificate.txt
          cat /tmp/new-certificate.txt /tmp/previous-certificate.txt
          NEW_CERT=$(awk '/certificate SHA-256 digest:/ { print $NF; exit }' /tmp/new-certificate.txt)
          OLD_CERT=$(awk '/certificate SHA-256 digest:/ { print $NF; exit }' /tmp/previous-certificate.txt)
          test -n "$NEW_CERT"
          if [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "Signing certificate does not match the current website APK."
            exit 1
          fi
          "$SDK_TOOLS/aapt" dump badging "$APK" > /tmp/new-manifest.txt
          "$SDK_TOOLS/aapt" dump badging /tmp/previous-spf.apk > /tmp/previous-manifest.txt
          head -n 1 /tmp/new-manifest.txt /tmp/previous-manifest.txt
          grep -q "name='com.superplusfitness.app'" /tmp/new-manifest.txt
          NEW_VERSION=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/new-manifest.txt | head -n 1)
          OLD_VERSION=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/previous-manifest.txt | head -n 1)
          echo "Android versionCode: previous=$OLD_VERSION new=$NEW_VERSION"
          test "$NEW_VERSION" -gt "$OLD_VERSION"
          unzip -l "$APK" > /tmp/apk-contents.txt
          grep 'bundle' /tmp/apk-contents.txt
          grep -q 'assets/index.android.bundle' /tmp/apk-contents.txt
          sha256sum "$APK"
          wc -c "$APK"
          head -n 1 /tmp/new-manifest.txt

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create spf-android-build7-2026-10-08 SP-Fitness-1.0.0-2026-10-08.apk \
            --title "SP Fitness — October 8 update" \
            --notes "Standalone Android APK matching the latest iOS build 7 member experience. Includes the redesigned Challenges hub, SP Points, rewards store, badges, streaks, weekly spin, refreshed home and login screens. Android versionCode 6; package and signing certificate verified against the previous website APK."
