name: Small Android test APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-small-test-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        run: npm install --package-lock=false

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --no-install --platform android

      - name: Build smaller release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk Super-Plus-Fitness-1.0.3.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create spf-settings-standalone-1.0.3-2026-10-06 Super-Plus-Fitness-1.0.3.apk             --title "Super Plus Fitness 1.0.3 — Settings Standalone"             --notes "Fresh standalone Android APK with the Settings tab, Profile inside Settings, Light/Dark/System appearance, Privacy Policy, Terms, support controls, logout, delete account and Android exit app. Includes the existing member features and is built for modern arm64 Android phones."
