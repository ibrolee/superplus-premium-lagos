name: Publish Android preview APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-preview-apk.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful APK artifact
        uses: actions/download-artifact@v5
        with:
          name: super-plus-fitness-android-preview
          path: apk
          run-id: 37440062269
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APK
        run: mv apk/app-debug.apk apk/Super-Plus-Fitness-1.0.3.apk

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create spf-settings-1.0.3-2026-10-06 apk/Super-Plus-Fitness-1.0.3.apk             --title "Super Plus Fitness 1.0.3 — Settings Update"             --notes "Android 1.0.3 preview with Settings tab, Profile inside Settings, Light/Dark/System appearance, support/legal controls, logout, delete account and Android exit app."
