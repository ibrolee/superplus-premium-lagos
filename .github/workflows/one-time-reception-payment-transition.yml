name: One-time receptionist payment history transition

on:
  push:
    branches:
      - integration/september-attendance-missed-scans
    paths:
      - .github/workflows/one-time-reception-payment-transition.yml

permissions:
  contents: write

jobs:
  transition:
    if: github.ref == 'refs/heads/integration/september-attendance-missed-scans'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the development branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make a guarded, targeted edit without accessing any database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/reception-member.$memberId.tsx')
          source = path.read_text()
          old = '''        supabase
          .from("payments")
          .select(
            "id, member_id, membership_id, amount, currency, status, payment_method, provider, paystack_reference, paid_at, created_at",
          )
          .eq("member_id", memberId)
          .order("created_at", { ascending: false }),'''
          new = '''        (async () => {
          // Before the coordinated DB cutover, the RPC is absent and we retain
          // the existing member-filtered read. Once the RPC exists, use it.
          const scoped = await supabase.rpc("reception_member_payment_history", {
            p_member_id: memberId,
          });

          if (!scoped.error || !["PGRST202", "42883"].includes(scoped.error.code)) {
            return scoped;
          }

          return supabase
            .from("payments")
            .select(
              "id, member_id, membership_id, amount, currency, status, payment_method, provider, paystack_reference, paid_at, created_at",
            )
            .eq("member_id", memberId)
            .order("created_at", { ascending: false });
        })(),'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one known payments query; no changes made.')
          source = source.replace(old, new, 1)
          marker = '''      setMember(memberResult.data);
      setMemberships(membershipsResult.data ?? []);
      setPayments(paymentsResult.data ?? []);'''
          replacement = '''      // Never silently present a permission or payment-read failure as zero payments.
      if (paymentsResult.error) {
        setError(`Unable to load payment history: ${paymentsResult.error.message}`);
        setLoading(false);
        return;
      }

      setMember(memberResult.data);
      setMemberships(membershipsResult.data ?? []);
      setPayments(paymentsResult.data ?? []);'''
          if source.count(marker) != 1:
              raise SystemExit('Expected exactly one member/payment state setter; no changes made.')
          path.write_text(source.replace(marker, replacement, 1))
          print('Guarded source edit succeeded; no database accessed.')
          PY
          git diff --check
          git diff --stat -- 'src/routes/reception-member.$memberId.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/routes/reception-member.$memberId.tsx'
          git commit -m 'Use member-scoped payment RPC with guarded pre-cutover fallback'
          git push origin HEAD:refs/heads/integration/september-attendance-missed-scans
