name: Regenerate integration route tree once

on:
  push:
    branches:
      - integration/september-attendance-missed-scans
    paths:
      - .github/workflows/sync-integration-route-tree.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/integration/september-attendance-missed-scans'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Regenerate routes by building without deploying
        run: bun run build
      - name: Typecheck regenerated route types
        run: bunx tsc --noEmit
      - name: Commit only generated route tree to original integration branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/routeTree.gen.ts
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Route tree already synced'; exit 0; fi
          git commit -m 'Sync generated TanStack routes for reception and attendance workspaces'
          git push origin HEAD:integration/september-attendance-missed-scans
