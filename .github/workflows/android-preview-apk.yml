name: Android preview APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-preview-apk.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        run: npm install --package-lock=false

      - name: Verify mobile TypeScript
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --no-install --platform android

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: super-plus-fitness-android-preview
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
