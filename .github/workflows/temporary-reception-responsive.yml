name: One-time Reception 2.0 responsive layout edits
on:
  push:
    branches: [feature/reception2-responsive-layout]
permissions:
  contents: write
jobs:
  edit-layouts:
    if: github.repository == 'ibrolee/superplus-premium-lagos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated layout branch
        uses: actions/checkout@v4
      - name: Update scoped reception layouts with guarded replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = {
            'src/routes/reception-workspace.tsx': [
              ('return <main className="min-h-screen bg-[#f4f6f1]', 'return <main className="reception-responsive min-h-screen bg-[#f4f6f1]', 1),
              ('<header className="flex flex-wrap items-start justify-between gap-4"><div>', '<header className="flex flex-wrap items-start justify-between gap-4"><div className="min-w-0 flex-1">', 1),
              ('className="flex flex-wrap items-center justify-between gap-3 rounded-xl bg-white/10 px-4 py-3"><div>', 'className="flex min-w-0 flex-wrap items-center justify-between gap-3 rounded-xl bg-white/10 px-4 py-3"><div className="min-w-0 flex-1">', 1),
              ('className="group flex min-h-36 flex-col justify-between', 'className="group flex min-h-36 min-w-0 flex-col justify-between', 1),
            ],
            'src/routes/reception-member.$memberId.tsx': [
              ('<main className="min-h-screen bg-background p-6">', '<main className="reception-responsive min-h-screen bg-background p-4 sm:p-6">', 1),
              ('<main className="min-h-screen bg-background">', '<main className="reception-responsive min-h-screen bg-background">', 1),
              ('<section className="mb-6 border border-border bg-card p-6">', '<section className="reception-profile-header mb-6 border border-border bg-card p-6">', 1),
              ('<div className="flex items-center gap-4">\n              <div className="flex h-16', '<div className="flex min-w-0 items-center gap-3 sm:gap-4">\n              <div className="flex h-16', 1),
              ('<div>\n                <h1 className="font-display text-3xl', '<div className="min-w-0 flex-1">\n                <h1 className="break-words font-display text-3xl', 1),
              ('<div className="rounded-xl bg-white p-5 shadow-sm">\n                    <QRCodeSVG', '<div className="reception-profile-qr w-full max-w-[300px] rounded-xl bg-white p-5 shadow-sm">\n                    <QRCodeSVG', 1),
              ('id="member-profile-qr"\n                      value=', 'id="member-profile-qr"\n                      className="block h-auto max-w-full"\n                      value=', 1),
              ('<p className="mt-1 font-display text-2xl font-black">\n                  {formatNaira(totalPaid)}', '<p className="reception-money mt-1 break-words font-display text-2xl font-black">\n                  {formatNaira(totalPaid)}', 1),
            ],
            'src/routes/reception-checkin.tsx': [
              ('<main className="min-h-[75vh] bg-muted', '<main className="reception-responsive min-h-[75vh] bg-muted', 3),
              ('id="reception-qr-reader"\n                  className="overflow-hidden border border-border bg-white"', 'id="reception-qr-reader"\n                  className="w-full min-w-0 max-w-full overflow-hidden border border-border bg-white"', 1),
              ('<h2 className="mt-2 font-display text-3xl font-bold uppercase">\n                    {result.memberName}', '<h2 className="mt-2 break-words font-display text-3xl font-bold uppercase">\n                    {result.memberName}', 1),
            ],
            'src/routes/management-communications.tsx': [
              ('return <main className="min-h-screen bg-[#f4f6f1]', 'return <main className="reception-responsive min-h-screen bg-[#f4f6f1]', 1),
              ('className="flex w-full flex-wrap items-center gap-2 sm:w-auto"', 'className="reception-record-actions flex w-full flex-wrap items-center gap-2 sm:w-auto"', 2),
              ('<div className="flex flex-wrap items-start justify-between gap-4"><div><a href="/reception-workspace"', '<div className="flex flex-wrap items-start justify-between gap-4"><div className="min-w-0 flex-1"><a href="/reception-workspace"', 1),
            ],
            'src/routes/management-standard-plan.tsx': [
              ('return <main className="min-h-screen bg-[#f4f6f1]', 'return <main className="reception-responsive min-h-screen bg-[#f4f6f1]', 1),
              ('lg:grid-cols-[minmax(0,1.5fr)_minmax(260px,1fr)]"><div className="space-y-6">', 'lg:grid-cols-[minmax(0,1.5fr)_minmax(260px,1fr)]"><div className="min-w-0 space-y-6">', 1),
              ('<aside className="h-fit rounded-[24px] bg-[#1a3226]', '<aside className="h-fit min-w-0 rounded-[24px] bg-[#1a3226]', 1),
              ('<p className="mt-4 text-3xl font-black">{money(receipt.total)}</p>', '<p className="reception-money mt-4 break-words text-3xl font-black">{money(receipt.total)}</p>', 1),
            ],
            'src/routes/management-custom-plan.tsx': [
              ('return <div className="min-h-screen bg-[#f4f6f1]', 'return <div className="reception-responsive min-h-screen bg-[#f4f6f1]', 1),
              ('lg:grid-cols-[minmax(0,1.5fr)_minmax(260px,1fr)]">\n        <div className="space-y-6">', 'lg:grid-cols-[minmax(0,1.5fr)_minmax(260px,1fr)]">\n        <div className="min-w-0 space-y-6">', 1),
              ('<aside className="h-fit space-y-5 lg:sticky', '<aside className="h-fit min-w-0 space-y-5 lg:sticky', 1),
              ('<strong className="text-3xl font-black text-[#b8ee73]">{naira(total)}</strong>', '<strong className="reception-money break-words text-3xl font-black text-[#b8ee73]">{naira(total)}</strong>', 1),
            ],
            'src/routes/management-members.tsx': [
              ('return <div className="min-h-screen bg-[#f4f6f1]', 'return <div className="reception-responsive min-h-screen bg-[#f4f6f1]', 1),
              ('<div className="mx-auto flex min-h-screen max-w-[1680px] flex-col lg:flex-row">', '<div className="mx-auto flex min-h-screen min-w-0 max-w-[1680px] flex-col lg:flex-row">', 1),
              ('<aside className="border-b border-[#243b32]', '<aside className="min-w-0 border-b border-[#243b32]', 1),
            ],
          }
          css = Path('src/components/reception/reception-responsive.css')
          assert css.is_file(), 'Scoped CSS missing'
          assert '@media (max-width: 639px)' in css.read_text(encoding='utf-8')
          assert 'overflow-x: hidden' not in css.read_text(encoding='utf-8')
          assert 'overflow-x: clip' not in css.read_text(encoding='utf-8')
          # Preflight every edit before writing a single file.
          for filename, changes in files.items():
              text = Path(filename).read_text(encoding='utf-8')
              assert 'reception-responsive.css' not in text, f'{filename}: imported already'
              assert text.startswith('import '), f'{filename}: import position changed'
              for before, after, count in changes:
                  actual = text.count(before)
                  if actual != count:
                      raise RuntimeError(f'{filename}: expected {count} occurrences, got {actual}: {before!r}')
                  if before == after:
                      raise RuntimeError('Replacement cannot be identical')
          for filename, changes in files.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = 'import "@/components/reception/reception-responsive.css";\n' + text
              for before, after, count in changes:
                  text = text.replace(before, after)
              if text.count('reception-responsive') < 2:
                  raise RuntimeError(f'{filename}: responsive import / root missing')
              path.write_text(text, encoding='utf-8')
              print('Updated responsive page:', filename)
          directory = Path('src/routes/management-members.tsx').read_text(encoding='utf-8')
          if 'mt-4 flex gap-2 overflow-x-auto pb-1 lg:flex-col lg:overflow-visible' not in directory or 'mt-4 flex gap-2 overflow-x-auto pb-2' not in directory:
              raise RuntimeError('Intentional horizontal navigation/filter scrolling was changed')
          if 'reception-profile-qr' not in Path('src/routes/reception-member.$memberId.tsx').read_text(encoding='utf-8'):
              raise RuntimeError('QR size was not corrected')
          if 'reception-record-actions' not in Path('src/routes/management-communications.tsx').read_text(encoding='utf-8'):
              raise RuntimeError('Mobile send-confirmation actions were not corrected')
          print('Verified all seven scoped pages, QR, notification controls and scrollable navigation')
          PY
      - name: Commit seven page edits and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/routes/reception-workspace.tsx 'src/routes/reception-member.$memberId.tsx' src/routes/reception-checkin.tsx src/routes/management-communications.tsx src/routes/management-standard-plan.tsx src/routes/management-custom-plan.tsx src/routes/management-members.tsx
          git rm -- .github/workflows/temporary-reception-responsive.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Make Reception 2.0 pages responsive while preserving scrollable navigation'
          git push origin HEAD:refs/heads/feature/reception2-responsive-layout
