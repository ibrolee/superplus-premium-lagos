name: Integration build and type check

on:
  push:
    branches:
      - integration/september-attendance-missed-scans
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Build-only placeholders: no real gym credentials or database writes.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-not-a-real-key
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies to diagnose existing lockfile drift
        run: bun install
      - name: Report lockfile consistency
        id: lockfile
        continue-on-error: true
        run: git diff --exit-code -- bun.lock
      - name: Build application (no deploy)
        id: build
        continue-on-error: true
        run: bun run build
      - name: TypeScript check
        id: typescript
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Require all checks to pass
        if: always()
        env:
          LOCK: ${{ steps.lockfile.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TYPES: ${{ steps.typescript.outcome }}
        run: |
          echo "Lockfile: $LOCK | Build: $BUILD | TypeScript: $TYPES"
          test "$LOCK" = success && test "$BUILD" = success && test "$TYPES" = success
