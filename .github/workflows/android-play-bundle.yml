name: Android Play Store bundle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-play-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout final SPF app
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --package-lock=false

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Validate branded assets
        run: npm run check:assets

      - name: Build signed production Android App Bundle with EAS
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build             --platform android             --profile production             --non-interactive             --wait             --json > /tmp/eas-build.json

          cat /tmp/eas-build.json

          BUILD_URL=$(jq -r '
            if type == "array" then
              .[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty
            else
              .artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty
            end
          ' /tmp/eas-build.json)

          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "Could not find the signed EAS Android bundle URL."
            exit 1
          fi

          curl -fL "$BUILD_URL" -o Super-Plus-Fitness-1.0.0.aab
          test -s Super-Plus-Fitness-1.0.0.aab
          file Super-Plus-Fitness-1.0.0.aab || true

      - name: Publish direct-download Play bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="spf-play-bundle-1.0.0-2026-10-07"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Super-Plus-Fitness-1.0.0.aab --clobber
          else
            gh release create "$TAG" Super-Plus-Fitness-1.0.0.aab               --title "Super Plus Fitness 1.0.0 — Google Play Bundle"               --notes "Signed production Android App Bundle for Google Play closed testing. Built with EAS from the final Super Plus Fitness 1.0.0 codebase."
          fi
