name: Temporary Expo Go Preview

on:
  push:
    branches:
      - preview/ios-expo-go-20261003
    paths-ignore:
      - expo-preview-url.txt

concurrency:
  group: super-plus-expo-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/ios-expo-go-20261003

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Install tunnel support
        run: npm install --no-save --legacy-peer-deps @expo/ngrok

      - name: Verify Expo account
        run: npx expo whoami

      - name: Start Expo Go tunnel and publish link
        run: |
          rm -f /tmp/expo.log /tmp/manifest.json /tmp/tunnels.json
          (npx expo start --go --tunnel --port 8081 > /tmp/expo.log 2>&1) &
          EXPO_PID=$!

          URL=""
          for i in $(seq 1 120); do
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              cat /tmp/expo.log
              exit 1
            fi

            LOG_URL=$(grep -Eo '(exp|exps)://[^[:space:]]+|https://[^[:space:]]+\.exp\.direct[^[:space:]]*' /tmp/expo.log | head -n 1 || true)
            if [ -n "$LOG_URL" ]; then
              URL="$LOG_URL"
              break
            fi

            if curl -fsS http://127.0.0.1:4040/api/tunnels > /tmp/tunnels.json 2>/dev/null; then
              PUBLIC_URL=$(node -e '
                const fs=require("fs");
                try {
                  const j=JSON.parse(fs.readFileSync("/tmp/tunnels.json","utf8"));
                  const urls=(j.tunnels||[]).map(t=>t.public_url).filter(Boolean);
                  const url=urls.find(u=>String(u).includes(".exp.direct")) || urls[0];
                  if (url) process.stdout.write(String(url));
                } catch {}
              ')
              if [ -n "$PUBLIC_URL" ]; then
                URL="$PUBLIC_URL"
                break
              fi
            fi

            if curl -fsS -H 'accept: application/expo+json,application/json' -H 'expo-platform: ios' http://127.0.0.1:8081 > /tmp/manifest.json 2>/dev/null; then
              HOST=$(node -e '
                const fs=require("fs");
                try {
                  const j=JSON.parse(fs.readFileSync("/tmp/manifest.json","utf8"));
                  const candidates=[j?.extra?.expoClient?.hostUri,j?.hostUri,j?.developer?.host,j?.launchAsset?.url].filter(Boolean);
                  for (const v of candidates) {
                    const m=String(v).match(/([A-Za-z0-9.-]+\.exp\.direct)(?::\d+)?/);
                    if (m) { process.stdout.write(m[1]); break; }
                  }
                } catch {}
              ')
              if [ -n "$HOST" ]; then
                URL="https://$HOST"
                break
              fi
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            cat /tmp/expo.log
            echo "Could not determine Expo Go tunnel URL."
            exit 1
          fi

          if [[ "$URL" == https://* ]]; then
            URL="exps://$(printf '%s' "$URL" | sed 's#^https://##')"
          elif [[ "$URL" == http://* ]]; then
            URL="exp://$(printf '%s' "$URL" | sed 's#^http://##')"
          fi

          echo "$URL" > "$GITHUB_WORKSPACE/expo-preview-url.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expo-preview-url.txt
          git commit -m "Publish temporary Expo Go preview link"
          git push origin HEAD:preview/ios-expo-go-20261003

          echo "Expo Go preview: $URL"
          echo "Keeping the tunnel online for about one hour."
          wait "$EXPO_PID"
