name: Build Android Play AAB v1

on:
  push:
    branches:
      - build/android-play-v1-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install mobile dependencies
        run: npm install --package-lock=false

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify Expo account
        run: eas whoami

      - name: Build Android production AAB
        run: eas build --platform android --profile production --non-interactive --wait --json > /tmp/eas-build.json

      - name: Extract and download AAB
        run: |
          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/eas-build.json", "utf8").trim();
          const data = JSON.parse(raw);
          const build = Array.isArray(data) ? data[0] : data;
          const url =
            build?.artifacts?.applicationArchiveUrl ||
            build?.artifacts?.buildUrl ||
            build?.artifactUrl;
          if (!url) {
            console.error(raw);
            throw new Error("Could not find AAB artifact URL in EAS build output.");
          }
          fs.writeFileSync("/tmp/aab-url.txt", url);
          console.log("AAB artifact URL found.");
          NODE
          curl -fL --retry 3 --retry-delay 3 "$(cat /tmp/aab-url.txt)" -o "$GITHUB_WORKSPACE/Super-Plus-Fitness-v1.0.0.aab"
          test -s "$GITHUB_WORKSPACE/Super-Plus-Fitness-v1.0.0.aab"

      - name: Upload Android Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: super-plus-fitness-play-aab-v1
          path: Super-Plus-Fitness-v1.0.0.aab
          if-no-files-found: error
          retention-days: 30
